# TEMPORARY: surface the Windows failure of the highs-linked build (CI run
# 41987167221 failed while R CMD build rendered the vignette, and rcmdcheck
# swallows the vignette's error). Exercise HiGHS' C API through the highs
# registry WITHOUT Uno first (tools/windebug/ccall_win.R), then install the
# package with full output and run the HiGHS (filtersqp) path, the tinytests
# and the vignette directly. Delete this file and its branch once the cause is
# known.
on:
  push:
    branches: [highs-linked-windebug]
  workflow_dispatch:

name: windebug

permissions: read-all

jobs:
  windebug:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: highs as installed
        run: |
          Rscript -e 'cat("highs", format(packageVersion("highs")), "\n"); inc <- system.file("include", package = "highs"); cat("include:", inc, "\n"); print(list.files(inc)); loadNamespace("highs"); print(getLoadedDLLs()[["highs"]]); r <- getDLLRegisteredRoutines("highs"); cat("registered .Call:", length(r$.Call), "\n")'

      - name: C API via registry, create/destroy and tiny solves (no Uno)
        continue-on-error: true
        shell: bash
        run: Rscript tools/windebug/ccall_win.R 2>&1; echo "exit=$?"

      - name: R CMD INSTALL (full output)
        shell: bash
        run: R CMD INSTALL --preclean . 2>&1 | tee install.log

      - name: HiGHS path through Uno (filtersqp, markers on stderr)
        continue-on-error: true
        shell: bash
        run: Rscript tools/windebug/uno_direct.R 2>&1; echo "exit=$?"

      - name: tinytest
        continue-on-error: true
        shell: bash
        run: Rscript -e 'print(tinytest::test_package("Uno"))' 2>&1; echo "exit=$?"
